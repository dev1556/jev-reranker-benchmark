[project]
name = "rag-reranker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Devnath CP", email = "devnathcp1@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.7.0",
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "torch>=2.14.0",
    "typesafe-sdk>=0.7.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
